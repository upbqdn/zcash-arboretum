name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeXML
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexml libimage-magick-perl
      - name: Prepare web sources
        run: |
          python3 -B site/tools/test_sitegen.py
          python3 site/tools/sitegen.py webprep
          if [ -d site/figures ]; then cp -r site/figures build/web/figures; fi
          cp site/arboretum.css build/arboretum.css
      - name: Convert volumes to HTML
        run: |
          set -e
          mkdir -p _site/pdf
          # one LaTeXML process per core, the long complete edition first; a failed volume
          # prints its log and fails the step once the others finish
          { echo "complete arboretum-complete 1800"
            for vol in $(python3 site/tools/sitegen.py volumes); do echo "$vol $vol 1200"; done
          } | xargs -P "$(nproc)" -L 1 sh -c '
              latexmlc --dest="_site/$0/index.html" --splitat=section --format=html5 \
                       --navigationtoc=context --css=../arboretum.css --timeout="$2" \
                       "build/web/$1.tex" > "build/$0.latexml.log" 2>&1 \
                && echo "=== $0 done" || { cat "build/$0.latexml.log"; exit 1; }'
          for vol in $(python3 site/tools/sitegen.py volumes); do cp "$vol.pdf" _site/pdf/; done
      - name: Landing page and assets
        run: |
          python3 site/tools/sitegen.py landing --out _site
          python3 site/tools/sitegen.py postprocess --out _site
          python3 site/tools/sitegen.py concordance --out _site
          cp site/arboretum.css site/favicon.svg _site/
          cp -r site/fonts _site/fonts
      - name: Build search index
        run: npx --yes pagefind --site _site
      - name: Check local links and anchors
        run: python3 -B site/tools/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
