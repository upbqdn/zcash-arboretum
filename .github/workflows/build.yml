name: Build volumes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - name: Check site tooling
        run: python3 -B site/tools/test_sitegen.py
      - name: Check numerical examples
        run: |
          python3 -B research/check_foundations.py
          python3 -B research/check_deployed.py
          python3 -B research/check_frontier.py
      - name: Build and check every document
        run: python3 -B site/tools/check_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: build/pdf/*.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/pdf/*.log
            build/pdf/*.build-output
